[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ifitworks"
version = "0.1.0"
description = "Personal tools, utility scripts, whatever. No guarantees"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "PyMuPDF>=1.23.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
pdf-stitcher = "ifitworks.pdf_stitcher:main"

[tool.setuptools.packages.find]
where = ["src"]
